[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-infrastructure-auditor"
version = "1.0.0"
description = "AWS cloud infrastructure auditor and FinOps cost optimizer CLI"
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "moto[ec2,cloudwatch]>=5.0"
]

build = [
    "pyinstaller>=6"
]

[project.scripts]
cloud-auditor = "cloud_auditor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
